services:
  web:
    build:
      context: .
      # Build over the host network, like the runtime below. On hosts whose docker daemon does not
      # manage iptables (daemon.json "iptables": false), the bridge network has no NAT/egress,
      # so apt/curl inside RUN steps cannot resolve or reach anything.
      network: host
    # CLAUDE_BOX_NAME (in .env) names this instance, so several can run on one docker daemon
    # (e.g. two users of one Mac). Unset: the classic names claude-box / claude-box-web.
    image: ${CLAUDE_BOX_NAME:-claude-box}
    container_name: ${CLAUDE_BOX_NAME:-claude-box}-web   # stable name (instead of the generated claude-box-web-1)
    labels:
      - claude-box.role=web
      - claude-box.instance=${CLAUDE_BOX_NAME:-claude-box}
    init: true                # tini as PID1: forwards SIGTERM to the entrypoint + reaps zombies
    restart: unless-stopped   # come back after a docker/host restart (sessions are restored, see web-serve.js)
    stop_grace_period: 15s    # give Claude in tmux time to save before the container is torn down
    network_mode: host        # reuse the host network (Tailscale, DB access); the web UI port is on the host
    env_file:
      - ./.env                # secrets + settings (token, proxy, PROJECT_DIR, web login/password)
    environment:
      - WEB_TUNNEL            # the host passes =1 when running `claude-box --tunnel`
    volumes:
      # working folder (shown as /workspace); the path is set in .env via PROJECT_DIR
      - ${PROJECT_DIR}:/workspace
      # the whole container home to the host: both ~/.claude (history) and ~/.claude.json (config/onboarding/resume)
      - ./home:/home/node
      # the HOST's own ~/.claude, read-only, for browsing/grepping host sessions from inside the box.
      # Kept out of /home/node so it never shadows the container's own state. Override with
      # HOST_CLAUDE_DIR in .env (e.g. point it at just <host home>/.claude/projects).
      - ${HOST_CLAUDE_DIR:-${HOME}/.claude}:/host-claude:ro
